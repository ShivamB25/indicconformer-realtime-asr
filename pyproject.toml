[project]
name = "indicconformer-realtime-asr"
version = "0.1.0"
description = "Production real-time AI4Bharat IndicConformer ASR service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "av>=14.0.0,<17",
    "fastapi>=0.115.0,<1",
    "huggingface-hub>=0.26.0,<2",
    "numpy>=1.26.0,<3",
    "onnx==1.20.1",
    "prometheus-client>=0.21.0,<1",
    "pydantic-settings>=2.6.0,<3",
    "python-multipart>=0.0.18,<1",
    "soundfile>=0.12.1,<1",
    "soxr>=0.5.0,<1",
    "structlog>=24.4.0,<26",
    "uvicorn[standard]>=0.30.0,<1",
    "webrtcvad-wheels==2.0.14",
]

[project.optional-dependencies]
cpu = [
    "onnxruntime==1.20.1",
]
gpu = [
    "onnxruntime-gpu==1.20.2",
]
official-cpu = [
    "onnxruntime==1.20.1",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "transformers>=4.46.0,<5",
]
official-gpu = [
    "onnxruntime-gpu==1.20.2",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "transformers>=4.46.0,<5",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0,<1",
    "httpx2>=2.9.1,<3",
    "mypy>=1.13.0,<2",
    "openai>=2.50.0,<3",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.25.0,<1",
    "ruff>=0.8.0,<1",
    "types-PyYAML>=6.0.12",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
    [
        { extra = "cpu" },
        { extra = "official-cpu" },
    ],
    [
        { extra = "cpu" },
        { extra = "official-gpu" },
    ],
    [
        { extra = "gpu" },
        { extra = "official-cpu" },
    ],
    [
        { extra = "gpu" },
        { extra = "official-gpu" },
    ],
    [
        { extra = "official-cpu" },
        { extra = "official-gpu" },
    ],
]

[tool.uv.sources]
onnxruntime = { index = "pypi" }
onnxruntime-gpu = { index = "pypi" }
torch = [
    { index = "pytorch-cpu", extra = "official-cpu" },
    { index = "pytorch-cu124", extra = "official-gpu" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "official-cpu" },
    { index = "pytorch-cu124", extra = "official-gpu" },
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
